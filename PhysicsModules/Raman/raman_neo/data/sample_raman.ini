# Example Raman Neo run on the bundled synthetic spectrum (bands at
# 480/720/1350/1580 cm^-1; rows 5-6 of sample_bands.txt are decoys that
# band_optimize should flag). Run from the repository root:
#     raman_neo -i PhysicsModules/Raman/raman_neo/data/sample_raman.ini

[Inputs]
data_file = PhysicsModules/Raman/raman_neo/data/sample_raman.dat
output_file = result/raman/sample_out.csv
band_file = PhysicsModules/Raman/raman_neo/data/sample_bands.txt
num_compounds = 1

[Populations]
population = 100
num_gen = 40
best_sample = 30
lucky_few = 20

[Solver]
# 0 = GA, 1 = GA + Rechenberg, 2 = Differential Evolution
# (or a Solvers registry name: PSO, CMA_ES)
solver_options = 1

[Mutations]
chance_of_mutation = 20
original_chance_of_mutation = 20
chance_of_mutation_e0 = 20
mutated_options = 1
selection_options = 0
crossover_options = 0

[Bands]
band_list = 1,2,3,4,5,6
band_optimize = True
band_optimize_percent = 0.05

[Spectrum]
xmin = 150
xmax = 1750
weight = 0.0
deltax = 1.0
baseline_order = 1

[Outputs]
print_graph = False
steady_state_exit = False
